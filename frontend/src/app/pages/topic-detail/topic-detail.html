<div class="topic-page">

    <nav class="navbar">

        <a
            class="logo"
            routerLink="/dashboard">

            <svg
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>

                <path d="M6.5 2H20V20H6.5A2.5 2.5 0 0 0 4 22V4.5A2.5 2.5 0 0 1 6.5 2Z"></path>

            </svg>

            <span>Lernkarten App</span>

        </a>

        <div class="nav-links">

            <a
                routerLink="/topics"
                routerLinkActive="active-link">

                Themen

            </a>

            <a
                routerLink="/flashcards"
                routerLinkActive="active-link">

                Karteikarten

            </a>

            <a
                routerLink="/learn"
                routerLinkActive="active-link">

                Lernmodus

            </a>

            <a
                routerLink="/quiz"
                routerLinkActive="active-link">

                Quiz

            </a>

            <button
                class="logout-button"
                (click)="logout()">

                Abmelden

            </button>

        </div>

    </nav>
        <button
        class="back-btn"
        (click)="goBack()">

        ← Zurück

    </button>

    <section class="page-header">

        <h1>
            {{ topic?.name }}
        </h1>

        <p>
            Karteikarten dieses Themas verwalten
        </p>

    </section>
    <div class="create-card-box">

        <h2>Neue Karteikarte erstellen</h2>

        <input
            type="text"
            [(ngModel)]="newQuestion"
            placeholder="Frage">

        <textarea
            [(ngModel)]="newAnswer"
            placeholder="Antwort">
        </textarea>

        <button
            class="add-card-btn"
            (click)="addFlashcard()">

            Karteikarte erstellen

        </button>

    </div>

    @if(editingCard){

        <div class="modal-overlay">

            <div class="edit-modal">

                <h2>
                    Karteikarte bearbeiten
                </h2>

                <input
                    type="text"
                    [(ngModel)]="editQuestion">

                <textarea
                    [(ngModel)]="editAnswer">
                </textarea>

                <div class="modal-buttons">

                    <button
                        class="save-btn"
                        (click)="saveEdit()">

                        Speichern

                    </button>

                    <button
                        class="cancel-btn"
                        (click)="cancelEdit()">

                        Abbrechen

                    </button>

                </div>

            </div>

        </div>

    }

    <div class="cards-grid">

        @for(card of flashcards; track card.id){

            <div class="flashcard">

                <h3>
                    {{ card.question }}
                </h3>

                <p>
                    {{ card.answer }}
                </p>

                <div class="card-actions">

                    <button
                        class="edit-btn"
                        (click)="startEdit(card)">

                        Bearbeiten

                    </button>

                    <button
                        class="delete-btn"
                        (click)="deleteCard(card)">

                        Löschen

                    </button>

                </div>

            </div>

        }

    </div>

</div>
