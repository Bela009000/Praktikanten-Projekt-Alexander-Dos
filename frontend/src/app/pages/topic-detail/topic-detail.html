<div class="topic-page">

    <nav class="navbar">

        <a routerLink="/dashboard">
            Dashboard
        </a>

        <a routerLink="/topics">
            Themen
        </a>

        <a routerLink="/flashcards">
            Karteikarten
        </a>

    </nav>

    <h1>

        {{ topic?.name }}

    </h1>

    <p>

        {{ topic?.description }}

    </p>

    @if(editingCard){

        <div class="modal-overlay">

            <div class="edit-modal">

                <h2>
                    Karteikarte bearbeiten
                </h2>

                <input
                    type="text"
                    [(ngModel)]="editQuestion">

                <textarea
                    [(ngModel)]="editAnswer">
                </textarea>

                <div class="modal-buttons">

                    <button
                        class="save-btn"
                        (click)="saveEdit()">

                        Speichern

                    </button>

                    <button
                        class="cancel-btn"
                        (click)="cancelEdit()">

                        Abbrechen

                    </button>

                </div>

            </div>

        </div>

    }

    <div class="cards-grid">

        @for(card of topic?.flashcards; track card){

            <div class="flashcard">

                <h3>

                    {{ card.question }}

                </h3>

                <p>

                    {{ card.answer }}

                </p>

                <div class="card-actions">

                    <button
                        class="edit-btn"
                        (click)="startEdit(card)">

                        Bearbeiten

                    </button>

                    <button
                        class="delete-btn"
                        (click)="deleteCard(card)">

                        Löschen

                    </button>

                </div>

            </div>

        }

    </div>

</div>
