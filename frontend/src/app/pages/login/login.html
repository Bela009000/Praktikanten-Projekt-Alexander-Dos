<div class="login-container">
  <div class="login-card">

    <h1>Lernkarten App</h1>

    <input
      type="text"
      placeholder="Benutzername"
      [(ngModel)]="username">

    <input
      type="password"
      placeholder="Passwort"
      [(ngModel)]="password">

    <button (click)="login()">
      Login
    </button>

  </div>
</div>
