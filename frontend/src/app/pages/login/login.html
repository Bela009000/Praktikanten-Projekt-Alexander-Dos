<nav class="navbar">

    <div class="logo">
        Lernkarten App
    </div>

</nav>
<div class="page">

    <div class="login-card">

        <h1>Anmelden</h1>

        <p class="subtitle">
            Melde dich mit deinem Konto an
        </p>

        <input
            type="text"
            placeholder="Benutzername"
            [(ngModel)]="username">

        <input
            type="password"
            placeholder="Passwort"
            [(ngModel)]="password">

        <p class="error">
            {{ errorMessage }}
        </p>

        <button
            class="login-button"
            (click)="login()">

            Anmelden

        </button>

        <p class="register-link">

            Noch kein Konto?

            <a routerLink="/register">
                Registrieren
            </a>

        </p>

    </div>

</div>
