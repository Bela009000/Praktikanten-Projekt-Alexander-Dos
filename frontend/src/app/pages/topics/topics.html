<div class="topics-page">

    <nav class="navbar">

        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path
                    d="M4 5.5C4 4.67 4.67 4 5.5 4H18.5C19.33 4 20 4.67 20 5.5V18.5C20 19.33 19.33 20 18.5 20H5.5C4.67 20 4 19.33 4 18.5V5.5Z"
                    stroke="currentColor"
                    stroke-width="2"/>
                <path
                    d="M8 8H16M8 12H16M8 16H13"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>
            </svg>

            Lernkarten App
        </div>

        <div class="nav-links">

            <a routerLink="/dashboard">
                Dashboard
            </a>

            <a routerLink="/topics" class="active">
                Themen
            </a>

            <a (click)="logout()" class="logout-link">
                Logout
            </a>

        </div>

    </nav>


    <section class="topics-header">

        <div class="header-icon">

            <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                <path
                    d="M3 7.5C3 6.67 3.67 6 4.5 6H9L11 8H19.5C20.33 8 21 8.67 21 9.5V17.5C21 18.33 20.33 19 19.5 19H4.5C3.67 19 3 18.33 3 17.5V7.5Z"
                    stroke="currentColor"
                    stroke-width="2"/>
            </svg>

        </div>

        <div>

            <h1>Meine Themen</h1>

            <p>
                Verwalte deine Themen und erstelle neue Lernbereiche
            </p>

        </div>

    </section>



    <section class="topic-input-section">

        <input
            type="text"
            placeholder="Neues Thema eingeben..."
            [(ngModel)]="topicName"
            (keyup.enter)="addTopic()">

        <button
            class="add-button"
            (click)="addTopic()">

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path
                    d="M12 5V19M5 12H19"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>
            </svg>

            Thema hinzufügen

        </button>

    </section>



    <section class="topics-grid">

        @for(topic of topics; track topic; let i = $index){

            <div class="topic-card">


                @if(editingIndex === i){


                    <div class="edit-area">

                        <input
                            type="text"
                            [(ngModel)]="editingName"
                            (keyup.enter)="saveEdit()">

                        <div class="edit-buttons">

                            <button
                                class="save-button"
                                (click)="saveEdit()">

                                Speichern

                            </button>

                            <button
                                class="cancel-button"
                                (click)="cancelEdit()">

                                Abbrechen

                            </button>

                        </div>

                    </div>

                }

                @else {


                    <div class="topic-content">

                        <div class="topic-icon">

                            <svg
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none">

                                <path
                                    d="M3 7.5C3 6.67 3.67 6 4.5 6H9L11 8H19.5C20.33 8 21 8.67 21 9.5V17.5C21 18.33 20.33 19 19.5 19H4.5C3.67 19 3 18.33 3 17.5V7.5Z"
                                    stroke="currentColor"
                                    stroke-width="2"/>

                            </svg>

                        </div>

                        <h3>
                            {{ topic.name }}
                        </h3>

                    </div>


                    <!-- Buttons -->

                    <div class="topic-actions">

                        <button
                            class="open-button"
                            (click)="openTopic(topic)">

                            Öffnen

                        </button>

                        <button
                            class="edit-button"
                            (click)="startEdit(i)"
                            title="Bearbeiten">

                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none">

                                <path
                                    d="M12 20H21"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"/>

                                <path
                                    d="M16.5 3.5C17.3284 2.67157 18.6716 2.67157 19.5 3.5C20.3284 4.32843 20.3284 5.67157 19.5 6.5L7 19L3 20L4 16L16.5 3.5Z"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"/>

                            </svg>

                        </button>

                        <button
                            class="delete-button"
                            (click)="deleteTopic(i)"
                            title="Löschen">

                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none">

                                <path
                                    d="M4 7H20"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"/>

                                <path
                                    d="M10 11V17M14 11V17"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"/>

                                <path
                                    d="M6 7L7 20H17L18 7"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linejoin="round"/>

                                <path
                                    d="M9 7V4H15V7"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linejoin="round"/>

                            </svg>

                        </button>

                    </div>

                }

            </div>

        }

    </section>

</div>
