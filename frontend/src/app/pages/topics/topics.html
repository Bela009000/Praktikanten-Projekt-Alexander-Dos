<div class="topics-page">

    <nav class="navbar">

        <div class="logo">
            Lernkarten App
        </div>

        <div class="nav-links">

            <a routerLink="/dashboard">
                Dashboard
            </a>

            <a routerLink="/topics">
                Themen
            </a>

        </div>

    </nav>

    <section class="topics-header">

        <h1>Meine Themen</h1>

        <p>
            Verwalte deine Themen und erstelle neue Lernbereiche
        </p>

    </section>

    <section class="topic-input-section">

        <input
            type="text"
            placeholder="Neues Thema eingeben..."
            [(ngModel)]="topicName">

        <button
            class="add-button"
            (click)="addTopic()">

            Thema hinzufügen

        </button>

    </section>

    <section class="topics-grid">

        @for(topic of topics; track topic; let i = $index){

        <div class="topic-card">

            <h3>
                {{ topic }}
            </h3>

            <button
                class="delete-button"
                (click)="deleteTopic(i)">

                Löschen

            </button>

        </div>

        }

    </section>

</div>
