<nav class="navbar">

    <div class="logo">
        Lernkarten App
    </div>

</nav>
<div class="page">

    <div class="register-card">

        <h1>Registrieren</h1>

        <p class="subtitle">
            Erstelle dein neues Konto
        </p>

        <input
            type="text"
            placeholder="Benutzername"
            [(ngModel)]="username">

        <input
            type="password"
            placeholder="Passwort"
            [(ngModel)]="password">

        <p class="error">
            {{ errorMessage }}
        </p>

        <p class="success">
            {{ successMessage }}
        </p>

        @if(!registrationSuccessful){

        <button
            class="register-button"
            (click)="register()">

            Registrieren

        </button>

        }

        <button
            class="login-button"
            routerLink="/login">

            Zurück zum Login

        </button>

    </div>

</div>
