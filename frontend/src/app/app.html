<router-outlet></router-outlet>

@if (showThemeSwitch) {

    <div
        class="theme-switch-container">

        <label
            class="theme-switch">

            <input
                type="checkbox"
                [checked]="!theme.isDarkMode"
                (change)="theme.toggleTheme()">

            <span
                class="slider">
            </span>

        </label>

    </div>

}
